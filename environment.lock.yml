# Exact known-good environment snapshot (linux-64) — the recovery point.
#
# Regenerate ON THIS convention after every successful deploy + test gate:
#     conda env export -n qaqmc | grep -v '^prefix:' > environment.lock.yml
# (then prepend/keep this header).  Past known-good states live in the git
# history of this file — no dated copies needed.
#
# Use environment.yml for a normal (latest-packages) install; use THIS file
# when you need to reproduce the exact environment that passed the gates:
#     conda env create -f environment.lock.yml
#
# Snapshot taken: 2026-07-17, after the PR #4/#5 merge gates (133 CPU tests,
# 108 real-GPU tests, cpunode02 production benchmarks) all passed on it.
